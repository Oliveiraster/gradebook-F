<div class="gradebook-wrapper">
  <h2 class="page-title">Lançamento de Notas</h2>

  <div class="filters" [formGroup]="filterForm">
    <mat-form-field appearance="outline">
      <mat-label>Turma</mat-label>
      <mat-select formControlName="classId">
        <mat-option *ngFor="let cls of classes" [value]="cls.id">{{ cls.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Disciplina</mat-label>
      <mat-select formControlName="subjectId">
        <mat-option *ngFor="let subj of subjects" [value]="subj.id">{{ subj.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" type="button" (click)="onSearch()">Buscar</button>
  </div>
  <div class="actions">
    <button mat-raised-button color="accent" type="button" (click)="openAddStudentDialog()">+ Adicionar Aluno</button>
  </div>

  <div *ngIf="students.length && assessments.length" [formGroup]="form" class="table-container">
    <table>
      <thead>
        <tr>
          <th>Aluno</th>
          <th *ngFor="let a of assessments">{{ a.title }}({{ a.weight }})</th>
          <th>Média</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students">
          <td>{{ s.name }}</td>
          <td *ngFor="let a of assessments">
            <input
              type="number"
              min="0"
              max="10"
              step="0.1"
              [formControlName]="getControlName(s.id, a.id)"
              placeholder="0–10"
              (input)="limitScore($event, s.id, a.id)"
            />
          </td>

          <td>{{ midMap[s.id] }}</td>
          <td class="actions-cell">
            <button mat-icon-button color="warn" type="button" (click)="editStudent(s)">
              <mat-icon class="edit">edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" type="button" (click)="deleteStudent(s.id)">
              <mat-icon class="delete">delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="actions">
      <button mat-raised-button color="primary" type="button" (click)="save()">Salvar Lançamentos</button>
    </div>
  </div>
</div>
