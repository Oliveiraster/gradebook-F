<div class="gradebook-wrapper">
  <h2 class="page-title">Lançamento de Notas</h2>

  <div class="filters" [formGroup]="filterForm">
    <mat-form-field appearance="outline">
      <mat-label>Turma</mat-label>
      <mat-select formControlName="classId">
        <mat-option *ngFor="let cls of classes" [value]="cls.id">{{ cls.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Disciplina</mat-label>
      <mat-select formControlName="subjectId">
        <mat-option *ngFor="let subj of subjects" [value]="subj.id">{{ subj.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" type="button" aria-label="Buscar alunos e notas" (click)="onSearch()">
      Buscar
    </button>
  </div>

  <div *ngIf="students.length && assessments.length" [formGroup]="form" class="table-container">
    <table>
      <thead>
        <tr>
          <th>Aluno</th>
          <th *ngFor="let a of assessments">
            {{ a.name }}
            <small>({{ a.weight }})</small>
          </th>
          <th>Média</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students">
          <td>{{ s.name }}</td>
          <td *ngFor="let a of assessments">
            <input
              type="number"
              min="0"
              max="10"
              step="0.1"
              [formControlName]="getControlName(s.id, a.id)"
              [attr.title]="'Nota de ' + s.name + ' em ' + a.name"
              placeholder="0–10"
              [attr.aria-label]="'Nota do aluno ' + s.name + ' em ' + a.name" />
          </td>
          <td>{{ midMap[s.id] }}</td>
        </tr>
      </tbody>
    </table>

    <button mat-raised-button color="accent" type="button" (click)="save()">Salvar Lançamentos</button>
  </div>
</div>
